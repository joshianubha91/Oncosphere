<header>
  <div class="nav-inner">
    <a href="#" class="logo">🔬 OncoSphere</a>
    <div class="badge-if">Impact Factor ≥ 15.0</div>
  </div>
</header>

<div class="hero">
  <h1>Oncology Literature Directory</h1>
  <p>Curated cancer research papers with Journal Impact Factor ≥ 15.0, organized by publication year and month.</p>
</div>

<div class="controls">
  <input type="text" id="searchInput" class="search-input" placeholder="Search across all 300 papers by title, gene (e.g. KRAS), author, or keyword...">

  <!-- Tabbed Years Navigation -->
  <div class="year-tabs-container" id="yearTabs">
    <button class="tab-btn active" data-year="All">All Years</button>
    <button class="tab-btn" data-year="2026">2026 (100)</button>
    <button class="tab-btn" data-year="2025">2025 (100)</button>
    <button class="tab-btn" data-year="2024">2024 (100)</button>
  </div>

  <!-- Category Filter Pills -->
  <div class="filter-bar">
    <span class="filter-label">Topic:</span>
    <button class="pill active" data-field="All">All</button>
    <button class="pill" data-field="Targeted & ADCs">Targeted & ADCs</button>
    <button class="pill" data-field="Cell Therapy">Cell Therapy</button>
    <button class="pill" data-field="Immuno-Oncology">Immuno-Oncology</button>
    <button class="pill" data-field="Liquid Biopsy">Liquid Biopsy</button>
    <button class="pill" data-field="General Oncology">General Oncology</button>
  </div>
</div>

<div class="stats-bar">
  <span id="resultsCount">Loading papers...</span>
  <span>Click "Read Paper" to resolve primary DOI</span>
</div>

<div class="container" id="papersContainer"></div>
<button id="loadMoreBtn" class="load-more-btn" style="display:none;">Load More Papers</button>

<script>
  let allPapers = [];
  let selectedYear = 'All';
  let selectedField = 'All';
  let searchTerm = '';
  let displayLimit = 35; // Loads first 35 for instant rendering, then loads more on click

  const container = document.getElementById('papersContainer');
  const searchInput = document.getElementById('searchInput');
  const resultsCount = document.getElementById('resultsCount');
  const loadMoreBtn = document.getElementById('loadMoreBtn');

  async function loadData() {
    try {
      const res = await fetch('papers.json?t=' + Date.now());
      if (res.ok) {
        allPapers = await res.json();
      }
    } catch (e) {
      console.log('Error loading papers.json');
    }
    render();
  }

  function render() {
    const filtered = allPapers.filter(p => {
      const matchYear = (selectedYear === 'All') || (String(p.year) === String(selectedYear));
      const matchField = (selectedField === 'All') || (p.field === selectedField);
      const q = searchTerm.toLowerCase();
      const matchSearch = 
        p.title.toLowerCase().includes(q) ||
        p.authors.toLowerCase().includes(q) ||
        p.journal.toLowerCase().includes(q) ||
        (p.abstract && p.abstract.toLowerCase().includes(q));

      return matchYear && matchField && matchSearch;
    });

    // Sort: Year descending (2026 -> 2025 -> 2024), then Impact Factor descending
    filtered.sort((a, b) => {
      if (b.year !== a.year) return b.year - a.year;
      return (b.impactFactor || 0) - (a.impactFactor || 0);
    });

    resultsCount.textContent = `Showing ${Math.min(displayLimit, filtered.length)} of ${filtered.length} paper${filtered.length === 1 ? '' : 's'}`;

    if (filtered.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:3rem; color:var(--text-low);">No papers matched your criteria.</div>';
      loadMoreBtn.style.display = 'none';
      return;
    }

    const visibleBatch = filtered.slice(0, displayLimit);

    container.innerHTML = visibleBatch.map(p => {
      const dateDisplay = p.month ? `${p.month} ${p.year}` : `${p.year}`;

      return `
        <article class="paper-row">
          <div class="paper-main">
            <div class="paper-tags">
              <span class="field-name">${p.field || 'General Oncology'}</span>
              <span class="date-pill">${dateDisplay}</span>
            </div>
            <h3 class="paper-title">
              <a href="${p.url}" target="_blank" rel="noopener noreferrer">${p.title}</a>
            </h3>
            <div class="paper-meta">
              ${p.authors} &bull; <span class="journal-title">${p.journal}</span>
            </div>
            <p class="abstract-preview">${p.abstract || ''}</p>
          </div>

          <div class="paper-side">
            <div class="side-if">
              <div class="if-number">${(p.impactFactor || 0).toFixed(1)}</div>
              <div class="if-caption">Impact Factor</div>
            </div>
            <a class="btn-link" href="${p.url}" target="_blank" rel="noopener noreferrer">
              Read Paper &rarr;
            </a>
          </div>
        </article>
      `;
    }).join('');

    // Show/hide Load More button
    if (displayLimit < filtered.length) {
      loadMoreBtn.style.display = 'block';
    } else {
      loadMoreBtn.style.display = 'none';
    }
  }

  loadMoreBtn.addEventListener('click', () => {
    displayLimit += 35;
    render();
  });

  searchInput.addEventListener('input', (e) => {
    searchTerm = e.target.value;
    displayLimit = 35;
    render();
  });

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedYear = btn.dataset.year;
      displayLimit = 35;
      render();
    });
  });

  document.querySelectorAll('.pill').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedField = btn.dataset.field;
      displayLimit = 35;
      render();
    });
  });

  loadData();
</script>
